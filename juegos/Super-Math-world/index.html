<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Math World: El Viaje Aritmético</title>
<style>
  :root{
    --grass:#4CB24C;
    --grass-2:#3fa03f;
    --grass-dark:#2C7A2E;
    --road:#E8CBA0;
    --road-edge:#B98A56;
    --frame:#F6C9DA;
    --frame-dark:#E39FC0;
    --navy:#171B33;
    --navy-2:#232a4d;
    --gold:#FFD54A;
    --grey:#8b8b98;
    --grey-dark:#5f5f6c;
    --water:#66C2E8;
    --water-dark:#2E86B8;
    --ink:#20233b;
    --white:#ffffff;
    --pink:#ff6fa5;
    --pink-dark:#d1467e;
    --blue:#3b82f6;
    --blue-dark:#1e4fc4;
    --green-ok:#3fae4e;
    --red-bad:#e0525f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 20%, #2a3060 0%, var(--navy) 70%);
    font-family:'Segoe UI', Tahoma, Verdana, sans-serif;
    color:var(--ink);
    padding:16px;
  }
  h1,h2,h3{
    font-family:'Arial Black', Impact, 'Segoe UI', sans-serif;
    letter-spacing:1px;
    margin:0;
  }
  #app{
    width:100%;
    max-width:960px;
  }
  .hidden{display:none !important;}

  /* ---------- Character select screen ---------- */
  #screen-select{
    background:linear-gradient(180deg,#2a2f57,#171b33);
    border:6px solid var(--frame);
    border-radius:20px;
    padding:36px 28px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  #screen-select h1{
    color:var(--gold);
    font-size:2.1rem;
    text-shadow:3px 3px 0 var(--navy-2), 0 0 20px rgba(255,213,74,.4);
  }
  #screen-select .subtitle{
    color:#c9cdf0;
    margin-top:10px;
    font-size:1rem;
  }
  .select-row{
    display:flex;
    gap:24px;
    justify-content:center;
    margin-top:34px;
    flex-wrap:wrap;
  }
  .char-card{
    background:var(--navy-2);
    border:4px solid #3a4074;
    border-radius:16px;
    padding:20px 28px;
    cursor:pointer;
    transition:transform .15s, border-color .15s, box-shadow .15s;
    width:190px;
  }
  .char-card:hover, .char-card:focus-visible{
    transform:translateY(-6px);
    box-shadow:0 10px 26px rgba(0,0,0,.4);
    outline:none;
  }
  .char-card.boy:hover{border-color:var(--blue);}
  .char-card.girl:hover{border-color:var(--pink);}
  .char-preview{
    width:110px;
    height:132px;
    margin:0 auto 14px;
  }
  .char-card p{
    color:#fff;
    font-weight:700;
    margin:6px 0 2px;
    font-size:1.05rem;
  }
  .char-card span{
    color:#a9aee0;
    font-size:.8rem;
  }
  .pixel-sprite{
    width:100%;
    height:100%;
    display:block;
    shape-rendering:crispEdges;
    image-rendering:pixelated;
  }

  /* ---------- Game screen ---------- */
  #screen-game{
    border:8px solid var(--frame);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.55);
  }
  #map-wrap{
    position:relative;
    width:100%;
    aspect-ratio:900/560;
    background:
      repeating-linear-gradient(45deg, var(--grass) 0 22px, var(--grass-2) 22px 44px);
    overflow:hidden;
  }
  #path-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  #trees-layer, #nodes-layer{
    position:absolute;
    inset:0;
  }
  .tree{
    position:absolute;
    width:34px;
    height:34px;
    transform:translate(-50%,-70%);
    filter:drop-shadow(1px 2px 0 rgba(0,0,0,.25));
  }
  .castle-wrap{
    position:absolute;
    width:110px;
    height:96px;
    transform:translate(-50%,-78%);
    filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3));
  }
  .node{
    position:absolute;
    width:46px;
    height:46px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:var(--road-edge);
    border:4px solid #8a6236;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:1.05rem;
    color:#4a2f14;
    cursor:default;
    transition:transform .2s, background .25s, border-color .25s, box-shadow .25s;
    user-select:none;
  }
  .node.locked{opacity:.55;}
  .node.current{
    background:var(--gold);
    border-color:#c99a1a;
    color:#4a2f14;
    cursor:pointer;
    box-shadow:0 0 0 6px rgba(255,213,74,.35);
    animation:pulse 1.1s infinite;
  }
  .node.current:hover{transform:translate(-50%,-50%) scale(1.08);}
  .node.correct{
    background:var(--green-ok);
    border-color:#276b32;
    color:#fff;
  }
  .node.wrong{
    background:var(--grey);
    border-color:var(--grey-dark);
    color:#fff;
  }
  .node .star{
    position:absolute;
    top:-16px;
    font-size:1.1rem;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 4px rgba(255,213,74,.35);}
    50%{box-shadow:0 0 0 10px rgba(255,213,74,.15);}
  }
  #player-token{
    position:absolute;
    width:38px;
    height:44px;
    transform:translate(-50%,-115%);
    transition:left .55s ease, top .55s ease;
    filter:drop-shadow(1px 2px 0 rgba(0,0,0,.35));
    pointer-events:none;
  }
  #player-token.ready-to-move{
    animation:tokenReady .6s infinite;
    cursor:pointer;
  }
  @keyframes tokenReady{
    0%,100%{transform:translate(-50%,-115%) scale(1);}
    50%{transform:translate(-50%,-115%) scale(1.18);}
  }
  #move-arrow{
    position:absolute;
    transform:translate(-50%,-190%);
    font-size:1.6rem;
    color:var(--gold);
    text-shadow:2px 2px 0 rgba(0,0,0,.4);
    animation:arrowBounce .7s infinite;
    pointer-events:none;
    z-index:15;
  }
  @keyframes arrowBounce{
    0%,100%{transform:translate(-50%,-190%);}
    50%{transform:translate(-50%,-225%);}
  }
  #move-hint{
    position:absolute;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    background:rgba(23,27,51,.88);
    color:#fff;
    font-weight:700;
    padding:9px 18px;
    border-radius:22px;
    font-size:.82rem;
    border:2px solid var(--gold);
    cursor:pointer;
    z-index:20;
    animation:hintPulse 1.2s infinite;
    text-align:center;
    max-width:88%;
  }
  @keyframes hintPulse{
    0%,100%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-50%) scale(1.04);}
  }

  /* HUD */
  #hud{
    background:var(--navy);
    color:#fff;
    display:flex;
    align-items:center;
    gap:22px;
    padding:10px 18px;
    font-family:'Consolas','Courier New',monospace;
    font-weight:700;
    flex-wrap:wrap;
  }
  #hud .hud-world{color:var(--gold); letter-spacing:1px;}
  #hud .hud-avatar{width:26px;height:30px;}
  #hud .hearts{letter-spacing:2px; font-size:1.1rem;}
  .heart-full{color:#ff5577;}
  .heart-empty{color:#4a4d66;}
  #hud .shields{display:flex; gap:4px; align-items:center;}
  #hud .shield-icon{width:19px; height:21px; display:inline-block;}
  #hud .shield-icon.empty{opacity:.28; filter:grayscale(1);}
  #hud .hud-score{margin-left:auto;color:#9fe3a0;}

  /* ---------- Modal ---------- */
  #modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,12,26,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:16px;
  }
  #modal-box{
    background:#fff;
    border:6px solid var(--navy-2);
    border-radius:16px;
    max-width:460px;
    width:100%;
    padding:26px 24px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #modal-box .modal-eyebrow{
    color:var(--blue-dark);
    font-size:.8rem;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:6px;
  }
  #timer-bar-wrap{
    height:10px;
    background:#e6e8f7;
    border-radius:6px;
    overflow:hidden;
    margin:0 0 18px;
  }
  #timer-bar{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#3fae4e,#ffd54a 60%,#e0525f);
    transition:width .1s linear;
  }
  #modal-question{
    font-size:1.4rem;
    font-weight:800;
    color:var(--ink);
    margin-bottom:20px;
  }
  #modal-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .opt-btn{
    padding:14px 8px;
    font-size:1.05rem;
    font-weight:700;
    border-radius:10px;
    border:3px solid #cfd3ef;
    background:#f4f5ff;
    cursor:pointer;
    transition:transform .12s, background .15s, border-color .15s;
    color:var(--ink);
  }
  .opt-btn:hover:not(:disabled){
    transform:translateY(-2px);
    border-color:var(--blue);
  }
  .opt-btn:disabled{cursor:default;}
  .opt-btn.opt-correct{background:var(--green-ok); border-color:#276b32; color:#fff;}
  .opt-btn.opt-wrong{background:var(--red-bad); border-color:#9c2b34; color:#fff;}

  #modal-feedback{
    margin-top:18px;
    min-height:52px;
    font-weight:700;
  }
  .feedback-ok{color:#2c7a2e;}
  .feedback-bad{color:#b7323d;}
  .feedback-shield{color:#1e5fc4;}
  #modal-continue{
    margin-top:14px;
    padding:10px 26px;
    border:none;
    border-radius:24px;
    background:var(--navy-2);
    color:#fff;
    font-weight:800;
    cursor:pointer;
    font-size:.95rem;
  }
  #modal-continue:hover{background:var(--blue-dark);}

  /* ---------- End screens ---------- */
  .end-screen{
    background:linear-gradient(180deg,#2a2f57,#171b33);
    border:6px solid var(--frame);
    border-radius:20px;
    padding:50px 30px;
    text-align:center;
  }
  .end-screen h2{
    font-size:2rem;
    margin-bottom:12px;
  }
  .end-screen.victory h2{color:var(--gold);}
  .end-screen.gameover h2{color:#ff8080;}
  .end-screen p{color:#dcdfff; font-size:1.1rem; margin:8px 0 26px;}
  .end-btn{
    padding:14px 34px;
    font-size:1.05rem;
    font-weight:800;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:var(--gold);
    color:#4a2f14;
  }
  .end-btn:hover{background:#ffe27a;}

  @media (max-width:520px){
    #modal-options{grid-template-columns:1fr;}
    .node{width:38px;height:38px;font-size:.9rem;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- Pantalla de selección de personaje -->
  <div id="screen-select" class="screen">
    <h1>SUPER MATH WORLD</h1>
    <p class="subtitle">El Viaje Aritmético &mdash; elige tu personaje para comenzar la aventura</p>
    <div class="select-row">
      <div class="char-card boy" id="pick-boy" tabindex="0" role="button">
        <div class="char-preview"></div>
        <p>Varón</p>
        <span>Ficha azul</span>
      </div>
      <div class="char-card girl" id="pick-girl" tabindex="0" role="button">
        <div class="char-preview"></div>
        <p>Mujer</p>
        <span>Ficha rosa</span>
      </div>
    </div>
  </div>

  <!-- Pantalla de juego -->
  <div id="screen-game" class="screen hidden">
    <div id="map-wrap">
      <svg id="path-svg" viewBox="0 0 900 560" preserveAspectRatio="none"></svg>
      <div id="trees-layer"></div>
      <div id="castle-layer"></div>
      <div id="nodes-layer"></div>
      <div id="player-token"></div>
      <div id="move-arrow" class="hidden">⬇</div>
      <div id="move-hint" class="hidden">➡ Pulsa una flecha del teclado o toca el mapa para avanzar</div>
    </div>
    <div id="hud">
      <span class="hud-world">WORLD 1</span>
      <span class="hearts" id="hud-hearts"></span>
      <span class="shields" id="hud-shields"></span>
      <span class="hud-avatar" id="hud-avatar"></span>
      <span class="hud-score" id="hud-score">Puntaje: 0/10</span>
    </div>
  </div>

  <!-- Pantalla de victoria -->
  <div id="screen-victory" class="end-screen victory screen hidden">
    <h2>¡Mundo Completado!</h2>
    <p id="victory-score">Puntaje final: 0/10</p>
    <button class="end-btn" id="btn-replay">Volver a jugar</button>
  </div>

  <!-- Pantalla de game over -->
  <div id="screen-gameover" class="end-screen gameover screen hidden">
    <h2>Game Over</h2>
    <p>Has perdido tus 3 vidas</p>
    <button class="end-btn" id="btn-retry">Reintentar</button>
  </div>

</div>

<!-- Modal de pregunta -->
<div id="modal-overlay" class="hidden">
  <div id="modal-box">
    <div class="modal-eyebrow">CASILLA <span id="modal-node-num"></span> DE 10</div>
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div id="modal-question"></div>
    <div id="modal-options"></div>
    <div id="modal-feedback"></div>
    <button id="modal-continue" class="hidden">Continuar</button>
  </div>
</div>

<script>
/* =========================================================
   RENDERIZADOR DE PIXEL ART (sprites por patrón de caracteres)
   ========================================================= */
function spriteSVG(pattern, colors){
  const h = pattern.length, w = pattern[0].length;
  let rects = '';
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const c = pattern[y][x];
      if(c !== '.'){
        rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colors[c]}"/>`;
      }
    }
  }
  return `<svg class="pixel-sprite" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${rects}</svg>`;
}

const BOY_PATTERN = [
  "..RRRRRR..",
  ".RRRRRRRR.",
  "RRRRRRRRRR",
  ".SSSSSSSS.",
  ".SKSSSSKS.",
  ".SSSSSSSS.",
  ".SSSTTSSS.",
  "..BBBBBB..",
  ".BBBBBBBB.",
  ".BBYBBYBB.",
  ".BB....BB.",
  ".FF....FF."
];
const GIRL_PATTERN = [
  "..HHHHHH..",
  ".HHHHHHHH.",
  "HHHHHHHHHH",
  ".SSSSSSSS.",
  ".SKSSSSKS.",
  ".SSSSSSSS.",
  ".SSSTTSSS.",
  "..PPPPPP..",
  ".PPPPPPPP.",
  "PPPPPPPPPP",
  ".PP....PP.",
  ".FF....FF."
];
const BOY_COLORS  = {R:"#d43b3b", S:"#f2c48d", K:"#222222", T:"#a35d3a", B:"#2e63c9", Y:"#f3d34a", F:"#5a3a20"};
const GIRL_COLORS = {H:"#5a3a20", S:"#f2c48d", K:"#222222", T:"#a35d3a", P:"#e5599f", F:"#5a3a20"};

const TREE_PATTERN = [
  "..GGG..",
  ".GGGGG.",
  "GGGGGGG",
  ".GGGGG.",
  "..GGG..",
  "...T...",
  "...T..."
];
const TREE_COLORS = {G:"#2d7a37", T:"#7a4a2b"};

const CASTLE_PATTERN = [
  "K"+"."+"K"+".".repeat(7)+"K"+"."+"K",
  "K".repeat(3)+".".repeat(7)+"K".repeat(3),
  "KwK"+".".repeat(7)+"KwK",
  "KwK"+".".repeat(7)+"KwK",
  "KwK"+"K".repeat(7)+"KwK",
  "K"+"w".repeat(11)+"K",
  "K"+"w".repeat(11)+"K",
  "K"+"w".repeat(4)+"G".repeat(3)+"w".repeat(4)+"K",
  "K"+"w".repeat(4)+"G".repeat(3)+"w".repeat(4)+"K",
  "K"+"w".repeat(4)+"G".repeat(3)+"w".repeat(4)+"K",
  "K"+"w".repeat(4)+"G".repeat(3)+"w".repeat(4)+"K",
  "K".repeat(13)
];
const CASTLE_COLORS = {K:"#5a5a6e", w:"#c9c9d6", G:"#241812"};

const SHIELD_PATTERN = [
  "..SSSS..",
  ".SSSSSS.",
  "SSSSSSSS",
  "SSCCCCSS",
  "SSCCCCSS",
  ".SCCCCS.",
  ".SSCCSS.",
  "..SSSS..",
  "...SS..."
];
const SHIELD_COLORS = {S:"#6b7690", C:"#ffd54a"};

/* =========================================================
   ESTADO Y DATOS DEL JUEGO
   ========================================================= */
const QUESTIONS = [
  { q:"8 + 15 = ?", options:["21","23","25","20"], correct:1 },
  { q:"34 − 19 = ?", options:["15","17","13","25"], correct:0 },
  { q:"7 × 6 = ?", options:["40","42","48","36"], correct:1 },
  { q:"56 ÷ 8 = ?", options:["6","7","8","9"], correct:1 },
  { q:"(−5) + 12 = ?", options:["7","−7","17","−17"], correct:0 },
  { q:"9 − (−4) = ?", options:["13","5","−13","−5"], correct:0 },
  { q:"(−6) × 3 = ?", options:["−18","18","−9","9"], correct:0 },
  { q:"(−24) ÷ 4 = ?", options:["−6","6","−4","4"], correct:0 },
  { q:"15 + 27 − 8 = ?", options:["34","32","36","30"], correct:0 },
  { q:"12 × 5 − 20 = ?", options:["40","60","20","50"], correct:0 }
];

// Coordenadas de las 10 casillas en el espacio del mapa (viewBox 900x560)
const NODE_POS = [
  {x:100,y:110}, {x:250,y:90}, {x:400,y:120}, {x:540,y:200}, {x:460,y:320},
  {x:300,y:360}, {x:150,y:300}, {x:190,y:450}, {x:370,y:480}, {x:650,y:470}
];

const TREE_POS = [
  {x:30,y:40},{x:70,y:200},{x:40,y:320},{x:30,y:480},{x:120,y:520},
  {x:320,y:40},{x:470,y:40},{x:620,y:50},{x:760,y:90},{x:820,y:180},
  {x:700,y:140},{x:560,y:60},{x:180,y:180},{x:230,y:260},{x:380,y:220},
  {x:420,y:400},{x:240,y:420},{x:60,y:120},{x:120,y:250},{x:660,y:300},
  {x:760,y:530},{x:90,y:430},{x:350,y:60},{x:480,y:280}
];

let state = {
  gender:null,
  color:null, // 'blue' | 'pink'
  currentNode:1,
  lives:3,
  shields:0,
  maxShields:3,
  score:0,
  nodeStatus: Array(10).fill('locked')
};

/* =========================================================
   RENDER DEL MAPA (fondo, camino, árboles, castillo, casillas)
   ========================================================= */
function vbToPercent(x,y){
  return { left:(x/900*100)+'%', top:(y/560*100)+'%' };
}

function buildPathSVG(){
  const svg = document.getElementById('path-svg');
  let path = `M ${NODE_POS[0].x} ${NODE_POS[0].y} `;
  for(let i=1;i<NODE_POS.length;i++){
    path += `L ${NODE_POS[i].x} ${NODE_POS[i].y} `;
  }
  const lakeOuter = "M560 230 L620 200 L700 210 L780 200 L850 240 L870 320 L860 420 L800 500 L700 520 L620 500 L560 460 L540 380 L550 300 Z";
  const lakeInner = "M575 240 L625 215 L695 225 L770 215 L830 245 L848 320 L838 410 L790 480 L700 500 L630 480 L580 450 L565 380 L572 305 Z";

  svg.innerHTML = `
    <path d="${lakeOuter}" fill="${'#2E86B8'}"></path>
    <path d="${lakeInner}" fill="${'#66C2E8'}"></path>
    <ellipse cx="650" cy="475" rx="70" ry="34" fill="#E8CBA0"></ellipse>
    <path d="${path}" fill="none" stroke="#B98A56" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="${path}" fill="none" stroke="#E8CBA0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"></path>
  `;
}

function buildTrees(){
  const layer = document.getElementById('trees-layer');
  layer.innerHTML = '';
  TREE_POS.forEach(p=>{
    const pos = vbToPercent(p.x,p.y);
    const div = document.createElement('div');
    div.className = 'tree';
    div.style.left = pos.left;
    div.style.top = pos.top;
    div.innerHTML = spriteSVG(TREE_PATTERN, TREE_COLORS);
    layer.appendChild(div);
  });
}

function buildCastle(){
  const layer = document.getElementById('castle-layer');
  const pos = vbToPercent(NODE_POS[9].x, NODE_POS[9].y - 36);
  layer.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'castle-wrap';
  div.style.left = pos.left;
  div.style.top = pos.top;
  div.innerHTML = spriteSVG(CASTLE_PATTERN, CASTLE_COLORS);
  layer.appendChild(div);
}

function buildNodes(){
  const layer = document.getElementById('nodes-layer');
  layer.innerHTML = '';
  NODE_POS.forEach((p,i)=>{
    const pos = vbToPercent(p.x,p.y);
    const div = document.createElement('div');
    div.className = 'node';
    div.id = 'node-'+(i+1);
    div.style.left = pos.left;
    div.style.top = pos.top;
    div.textContent = (i+1);
    div.addEventListener('click', ()=> onNodeClick(i+1));
    layer.appendChild(div);
  });
  refreshNodes();
}

function refreshNodes(){
  for(let i=0;i<10;i++){
    const num = i+1;
    const el = document.getElementById('node-'+num);
    el.classList.remove('locked','current','correct','wrong');
    const status = state.nodeStatus[i];
    if(status === 'correct'){
      el.classList.add('correct');
      el.innerHTML = num + '<span class="star">⭐</span>';
    } else if(status === 'wrong'){
      el.classList.add('wrong');
      el.textContent = num;
    } else if(num === state.currentNode){
      el.classList.add('current');
      el.textContent = num;
    } else {
      el.classList.add('locked');
      el.textContent = num;
    }
  }
  movePlayerToken();
  refreshHud();
}

function movePlayerToken(){
  const token = document.getElementById('player-token');
  const idx = Math.min(state.currentNode,10) - 1;
  const pos = vbToPercent(NODE_POS[idx].x, NODE_POS[idx].y);
  token.style.left = pos.left;
  token.style.top = pos.top;
  const pattern = state.gender === 'boy' ? BOY_PATTERN : GIRL_PATTERN;
  const colors = state.gender === 'boy' ? BOY_COLORS : GIRL_COLORS;
  token.innerHTML = spriteSVG(pattern, colors);
}

function refreshHud(){
  const hearts = document.getElementById('hud-hearts');
  let h = '';
  for(let i=0;i<3;i++){
    h += i < state.lives ? '<span class="heart-full">♥</span>' : '<span class="heart-empty">♥</span>';
  }
  hearts.innerHTML = h;

  const shieldsEl = document.getElementById('hud-shields');
  let s = '';
  for(let i=0;i<state.maxShields;i++){
    const cls = i < state.shields ? 'shield-icon' : 'shield-icon empty';
    s += `<span class="${cls}">${spriteSVG(SHIELD_PATTERN, SHIELD_COLORS)}</span>`;
  }
  shieldsEl.innerHTML = s;

  document.getElementById('hud-score').textContent = `Puntaje: ${state.score}/10`;
  const avatar = document.getElementById('hud-avatar');
  const pattern = state.gender === 'boy' ? BOY_PATTERN : GIRL_PATTERN;
  const colors = state.gender === 'boy' ? BOY_COLORS : GIRL_COLORS;
  avatar.innerHTML = spriteSVG(pattern, colors);
}

/* =========================================================
   FLUJO DEL JUEGO
   ========================================================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function startGame(gender){
  stopTimer();
  window.removeEventListener('keydown', onMoveKey);
  document.getElementById('map-wrap') && document.getElementById('map-wrap').removeEventListener('click', onMoveClick);
  document.getElementById('move-arrow').classList.add('hidden');
  document.getElementById('move-hint').classList.add('hidden');
  moveTarget = null;
  state = {
    gender: gender,
    color: gender === 'boy' ? 'blue' : 'pink',
    currentNode: 1,
    lives: 3,
    shields: 0,
    maxShields: 3,
    score: 0,
    nodeStatus: Array(10).fill('locked')
  };
  showScreen('screen-game');
  buildPathSVG();
  buildTrees();
  buildCastle();
  buildNodes();
}

function onNodeClick(num){
  if(num !== state.currentNode) return;
  if(state.nodeStatus[num-1] !== 'locked') return;
  openModal(num);
}

let selectedOptionBtn = null;

function openModal(num){
  const q = QUESTIONS[num-1];
  document.getElementById('modal-node-num').textContent = num;
  document.getElementById('modal-question').textContent = q.q;
  const optsWrap = document.getElementById('modal-options');
  optsWrap.innerHTML = '';
  document.getElementById('modal-feedback').textContent = '';
  document.getElementById('modal-feedback').className = '';
  document.getElementById('modal-continue').classList.add('hidden');

  q.options.forEach((optText, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = optText;
    btn.addEventListener('click', ()=> onAnswer(num, idx, btn));
    optsWrap.appendChild(btn);
  });

  document.getElementById('modal-overlay').classList.remove('hidden');
  startTimer(num);
}

function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
  stopTimer();
}

/* ---- Temporizador por pregunta ---- */
const TIME_LIMIT = 20; // segundos para responder cada pregunta
let timerInterval = null;
let timeLeft = TIME_LIMIT;

function startTimer(num){
  timeLeft = TIME_LIMIT;
  const bar = document.getElementById('timer-bar');
  bar.style.width = '100%';
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timeLeft -= 0.1;
    const pct = Math.max(0, (timeLeft / TIME_LIMIT) * 100);
    bar.style.width = pct + '%';
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      onAnswer(num, -1, null); // -1 = tiempo agotado, sin opción seleccionada
    }
  }, 100);
}

function stopTimer(){
  clearInterval(timerInterval);
}

function onAnswer(num, idx, btnEl){
  stopTimer();
  const q = QUESTIONS[num-1];
  const allBtns = document.querySelectorAll('#modal-options .opt-btn');
  allBtns.forEach(b => b.disabled = true);

  const feedback = document.getElementById('modal-feedback');
  const isCorrect = idx === q.correct;
  const timedOut = idx === -1;

  if(isCorrect){
    if(btnEl) btnEl.classList.add('opt-correct');
    state.score += 1;
    state.nodeStatus[num-1] = 'correct';
    const gainedShield = state.shields < state.maxShields;
    if(gainedShield) state.shields += 1;
    feedback.textContent = '¡Bien hecho! ¡Respuesta correcta!' + (gainedShield ? ' Ganaste un escudo 🛡 para protegerte de un futuro error.' : '');
    feedback.className = 'feedback-ok';
  } else {
    if(btnEl) btnEl.classList.add('opt-wrong');
    allBtns[q.correct].classList.add('opt-correct');
    state.nodeStatus[num-1] = 'wrong';
    const prefix = timedOut ? '¡Se acabó el tiempo!' : '¡Incorrecto!';
    if(state.shields > 0){
      state.shields -= 1;
      feedback.textContent = `${prefix} Tu escudo te protegió y no perdiste ninguna vida. La respuesta correcta era ${q.options[q.correct]}`;
      feedback.className = 'feedback-shield';
    } else {
      state.lives -= 1;
      feedback.textContent = `${prefix} Has perdido 1 vida. La respuesta correcta era ${q.options[q.correct]}`;
      feedback.className = 'feedback-bad';
    }
  }

  refreshHud();

  const continueBtn = document.getElementById('modal-continue');
  continueBtn.classList.remove('hidden');
  continueBtn.onclick = () => {
    closeModal();
    resolveAfterAnswer(num);
  };
}

function resolveAfterAnswer(num){
  if(state.lives <= 0){
    refreshNodes();
    showScreen('screen-gameover');
    return;
  }
  if(num === 10){
    refreshNodes();
    document.getElementById('victory-score').textContent = `Puntaje final: ${state.score}/10`;
    showScreen('screen-victory');
    return;
  }
  refreshNodes(); // pinta la casilla recién resuelta; el personaje aún no se mueve
  showMovePrompt(num + 1);
}

/* =========================================================
   MOVIMIENTO INTERACTIVO DEL PERSONAJE
   ========================================================= */
let moveTarget = null;

function showMovePrompt(nextNum){
  moveTarget = nextNum;
  const pos = vbToPercent(NODE_POS[nextNum-1].x, NODE_POS[nextNum-1].y);
  const arrow = document.getElementById('move-arrow');
  arrow.style.left = pos.left;
  arrow.style.top = pos.top;
  arrow.classList.remove('hidden');
  document.getElementById('move-hint').classList.remove('hidden');
  document.getElementById('player-token').classList.add('ready-to-move');

  window.addEventListener('keydown', onMoveKey);
  document.getElementById('map-wrap').addEventListener('click', onMoveClick);
}

function onMoveKey(e){
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();
    performMove();
  }
}

function onMoveClick(){
  performMove();
}

function performMove(){
  if(moveTarget === null) return;
  window.removeEventListener('keydown', onMoveKey);
  document.getElementById('map-wrap').removeEventListener('click', onMoveClick);
  document.getElementById('move-arrow').classList.add('hidden');
  document.getElementById('move-hint').classList.add('hidden');
  document.getElementById('player-token').classList.remove('ready-to-move');

  state.currentNode = moveTarget;
  moveTarget = null;
  refreshNodes();
}

/* =========================================================
   EVENTOS DE INICIO
   ========================================================= */
document.getElementById('pick-boy').querySelector('.char-preview').innerHTML = spriteSVG(BOY_PATTERN, BOY_COLORS);
document.getElementById('pick-girl').querySelector('.char-preview').innerHTML = spriteSVG(GIRL_PATTERN, GIRL_COLORS);

function bindPick(elId, gender){
  const el = document.getElementById(elId);
  el.addEventListener('click', ()=> startGame(gender));
  el.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); startGame(gender); }
  });
}
bindPick('pick-boy','boy');
bindPick('pick-girl','girl');

document.getElementById('btn-replay').addEventListener('click', ()=> showScreen('screen-select'));
document.getElementById('btn-retry').addEventListener('click', ()=> showScreen('screen-select'));
</script>
